<!DOCTYPE html>
<html>
    <head>
        <title>AH-ROLL-RAH</title>

        <style>
            @import url(https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap);
            
            body
            {
                display: flex;
                justify-content: center;
                align-items: center;

                min-height: 100svh;
                min-width: 100svw;
                margin: 0;
                padding: 0;
                background-color: #000000;

                overflow: auto;
            
                font-family: 'Press Start 2P', 'DotGothic16', sans-serif;
            }

            canvas
            {
                background-color: #FFFFFF;

                aspect-ratio: 4/3;

                width: min(100svw, (100svh*4/3));
                height: min(100svh, (100svw*3/4));

                max-width: 1200px;
                max-height: 900px;

                touch-action: none;
            }
        </style>

    </head>
    <body>
        <canvas id="main-canvas" width="800" height="600"></canvas>
        <script type="module" src="js/app.js"></script>
    </body>
</html>
