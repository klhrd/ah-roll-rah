<!DOCTYPE html>
<html>
    <head>
        <title>AH-ROLL-AH</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">

        <style>
            body
            {
                display: flex;
                justify-content: center;
                align-items: center;

                min-height: 100svh;
                min-width: 100svw;
                margin: 0;
                padding: 0;
                background-color: #000000;

                overflow: auto;
            
                font-family: 'Press Start 2P', 'DotGothic16', sans-serif;
            }

            canvas
            {
                background-color: #FFFFFF;

                aspect-ratio: 4/3;

                width: min(100svw, (100svh*4/3));
                height: min(100svh, (100svw*3/4));

                max-width: 1200px;
                max-height: 900px;
            }
        </style>

    </head>
    <body>
        <canvas id="main-canvas" height="600" width="800"></canvas>
        <script type="module" src="js/app.js"></script>
    </body>
</html>
